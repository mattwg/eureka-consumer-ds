# Golden METHOD for q008 — FROZEN. Do not change.
# Certified by a codeowner against an outside source (see certified_against below).
# We freeze the METHOD (tables/joins/filters/shape), not the number (numbers drift daily).

status: frozen              # proposed -> frozen (codeowner sets frozen on approval)
question_id: consumer-q008

# --- what makes an answer correct ---
target_tables:
  - prod.bi.base_data_for_ret_cancel        # canonical B2C transaction log; no join needed

renewal_signal: next_txn_stamp_sub_level    # MUST use this (same-subscription renewal).
                                            # Using next_txn_stamp instead is WRONG.

metric_formula: "COUNT(next_txn_stamp_sub_level) * 100.0 / COUNT(*) at each payment_order"

step_definitions:
  M1:   "payment_order = 1  (first renewal, payment 1 -> 2)"
  M2:   "payment_order = 2  (second renewal, payment 2 -> 3)"
  M2plus: "payment_order >= 2, aggregated (repeat renewals)"

required_filters:
  - "transaction_business_line = 'B2C'"
  - "product_sub_type = 'C Plus monthly'"
  - "recurring_payment_end_ts < CURRENT_DATE() - INTERVAL 7 DAYS"   # 7-day eligibility lag
  - "was_buy_transaction_refunded = FALSE"                          # defensive no-op on this table

required_caveats:
  - "biggest drop-off is at M1 (first renewal) -- the largest single leak"
  - "retention RISES with tenure (M2 > M1, M2+ highest); do not describe it as declining"
  - "recent cohorts look artificially low until the 7-day retry window closes"

method_shape: >
  Step (conditional) renewal rate per payment_order on the B2C transaction log. NOT a
  single-cohort survival curve (that is a different question / query). Answer must report
  M1, M2, and M2+ and name where the biggest drop-off is.

# --- optional numeric guard-band (OFF by default; codeowner may enable) ---
# Method-only cannot catch right-method-wrong-number. If the codeowner wants a guard,
# enable this and the validator will sanity-check the blended M1 rate is in range.
numeric_guardband:
  enabled: false
  m1_blended_pct_range: [60.0, 68.0]   # example band; codeowner to confirm/adjust

# --- external anchor used to certify ---
certified_against: dashboard           # dashboard | prior_report | independent_query
external_anchor_note: >
  Certified by @bhkumar-coursera on PR #112 against the pod's Looker retention dashboard
  (EDS_Consumer_KPI / new_retention_metrics), which matched:
  https://looker.dkandu.me/explore/EDS_Consumer_KPI/new_retention_metrics?qid=n5uPq6W9nShuCcCwrxyHFa&origin_space=4362
  Reviewer also confirmed: blended matured cohorts (7-day retry window) is the intended
  reading, and M2+ = payment_order >= 2 aggregated. The Jan-2025 benchmark in the skill's
  metric-definitions.md (M1 62.6 / M2 67.8 / M3 74.8 / M4 78.5 / M5 79.5) was also reproduced
  to the decimal by the certifying run.
reviewer: bhkumar-coursera
certification_record: golden/certification.md   # verbatim reviewer verdict + anchor link
